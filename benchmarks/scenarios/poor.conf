# Edge of range, or a heavily contended channel. The scenario FEC has to
# survive: 5% loss arriving in runs of ~5 packets means 100 ms gaps, and Opus
# FEC repairs only the first frame of each run.
name = poor
base_delay_ms = 50
jitter_ms = 50
jitter_shape = pareto
burst_loss_percent = 5
burst_mean_length = 5
reorder_percent = 2
duplicate_percent = 0.5
