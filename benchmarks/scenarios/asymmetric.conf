# One direction congested and the other clear. Exists because clock-offset
# estimation assumes a symmetric path: this is the scenario where the reported
# offset is wrong by (d1-d2)/2 and no amount of probing can reveal it. See the
# uncertainty bound documented on ClockSync::offset_uncertainty_us.
name = asymmetric
up.base_delay_ms = 40
up.jitter_ms = 20
up.jitter_shape = normal
down.base_delay_ms = 4
down.jitter_ms = 2
down.jitter_shape = normal
